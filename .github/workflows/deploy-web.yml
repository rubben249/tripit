name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      - name: Export static web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Belt-and-suspenders: the artifact-based Pages deploy may not run
      # Jekyll at all, but if it ever does, this stops it from silently
      # dropping our _expo/ directory (Jekyll ignores underscore-prefixed
      # paths by default).
      - run: touch dist/.nojekyll

      # web.output is 'single' (SPA) — only one index.html is generated, so
      # GitHub Pages 404s on a direct deep link (e.g. /trip/new). Serving
      # index.html as the 404 page lets client-side routing take over.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
