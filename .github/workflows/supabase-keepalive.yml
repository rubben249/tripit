name: Supabase keep-alive

# Free Supabase projects pause after a period of inactivity (see
# docs/PLAN.md section 2). A lightweight read every few days keeps it awake.
# Requires repo secrets SUPABASE_URL and SUPABASE_ANON_KEY once the project
# exists (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
